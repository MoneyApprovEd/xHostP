<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070a" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020305" />
    </linearGradient>

    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambient" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80" />
    </filter>

    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.01)" />
    </linearGradient>
    
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)" />

  <circle cx="200" cy="350" r="250" fill="#00f3ff" opacity="0.12" filter="url(#ambient)" />
  <circle cx="1000" cy="50" r="300" fill="#00f3ff" opacity="0.08" filter="url(#ambient)" />

  <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.5" fill="rgba(255,255,255,0.03)" />
  </pattern>
  <rect width="1200" height="400" fill="url(#dots)" />

  <g transform="translate(650, 70)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="480" height="260" rx="16" fill="url(#glassCard)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    
    <rect x="0" y="0" width="120" height="260" rx="16" fill="rgba(0,0,0,0.2)" />
    <rect x="15" y="20" width="30" height="30" rx="6" fill="#00f3ff" opacity="0.8" filter="url(#neon)"/>
    <rect x="15" y="70" width="80" height="8" rx="4" fill="rgba(255,255,255,0.2)" />
    <rect x="15" y="100" width="60" height="8" rx="4" fill="rgba(255,255,255,0.1)" />
    <rect x="15" y="130" width="70" height="8" rx="4" fill="rgba(255,255,255,0.1)" />

    <rect x="0" y="65" width="3" height="18" rx="1.5" fill="#00f3ff" filter="url(#neon)" />

    <rect x="140" y="20" width="100" height="60" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    <rect x="255" y="20" width="100" height="60" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    <rect x="370" y="20" width="90" height="60" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    
    <rect x="140" y="100" width="320" height="140" rx="10" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    <rect x="155" y="120" width="150" height="6" rx="3" fill="rgba(0,243,255,0.6)" />
    <rect x="155" y="140" width="200" height="6" rx="3" fill="rgba(255,255,255,0.3)" />
    <rect x="155" y="160" width="120" height="6" rx="3" fill="rgba(255,255,255,0.3)" />
    <rect x="155" y="180" width="250" height="6" rx="3" fill="rgba(255,0,0,0.5)" />
    <rect x="155" y="200" width="180" height="6" rx="3" fill="rgba(255,255,255,0.3)" />
  </g>

  <g transform="translate(100, 200)">
    <text x="0" y="0" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="85" fill="#ffffff" letter-spacing="1">
      x<tspan fill="#00f3ff" filter="url(#neon)">Host</tspan>P
    </text>

    <text x="5" y="45" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="18" fill="rgba(255, 255, 255, 0.6)" letter-spacing="4">
      EMBEDDED SERVER PANEL
    </text>

    <rect x="5" y="70" width="80" height="4" rx="2" fill="#00f3ff" filter="url(#neon)" />
  </g>
</svg>
